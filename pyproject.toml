[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing"
version = "0.1.0"
description = "Reads a repository's merge history and PR text and shows how its structure and direction changed."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
bearing = "bearing.cli:main"

[tool.setuptools.packages.find]
include = ["bearing*"]

[tool.setuptools.package-data]
bearing = ["migrations/*.sql"]

[tool.ruff]
target-version = "py312"
# The kit's scripts are in the kit's style, not this project's (the kit's README, "Style check setup").
extend-exclude = ["scripts"]

[tool.pytest.ini_options]
# The kit's own tests in scripts/ are run by its workflows, not by this project's pytest.
testpaths = ["tests"]
addopts = ["--ignore=scripts"]
